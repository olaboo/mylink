<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>olaboo · MyLink</title><style>
:root{--bg:#f5f4ef;--ink:#202a24;--card:#fff;--line:#dce2da;--accent:#d9edbb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;min-height:100vh}body.dark{--bg:#17211b;--ink:#eff4ed;--card:#243129;--line:#3d5042;--accent:#405d32}header{max-width:1040px;margin:auto;padding:28px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:23px}button{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:10px 16px}button:focus-visible,a:focus-visible{outline:3px solid #759e53;outline-offset:5px}main{max-width:560px;margin:42px auto 0;padding:0 24px;text-align:center}.avatar{width:92px;height:92px;border-radius:30px;background:var(--accent);display:grid;place-items:center;margin:auto;font-weight:800;font-size:34px;transform:rotate(-6deg)}.eyebrow{font-size:11px;letter-spacing:3px;margin:30px 0 14px}h1{font-size:36px;letter-spacing:-2px;margin:0 0 14px}p{line-height:1.8;opacity:.75}.links{display:grid;gap:13px;margin:34px 0 24px;text-align:left}.link{display:flex;align-items:center;gap:17px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;transition:transform .15s}.link:hover{transform:translateY(-3px)}.icon{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:var(--accent);font-weight:800;flex-shrink:0}.label{flex:1}.label strong{display:block;font-size:16px;margin-bottom:5px}.label small{opacity:.7;font-size:12px}#status{min-height:24px;font-size:13px}footer{text-align:center;margin:35px 0 24px;font-size:12px;opacity:.65}@media(max-width:480px){header{padding:22px}main{margin-top:26px}h1{font-size:28px}.link{padding:17px}}
</style></head><body><header><div class="brand">MyLink /</div><button id="theme">다크 모드</button></header><main><div class="avatar" aria-hidden="true">o.</div><div class="eyebrow">A LITTLE ABOUT MY WORLD</div><h1>안녕하세요, olaboo입니다.</h1><p>나의 기록과 프로젝트를 잇는 작은 공간.<br>아래 링크에서 만나보세요.</p><nav class="links" aria-label="나의 링크"><a class="link" href="https://github.com/olaboo" target="_blank" rel="noopener noreferrer"><span class="icon">G</span><span class="label"><strong>GitHub</strong><small>코드와 프로젝트를 기록하는 곳</small></span><span>↗</span></a><a class="link" href="https://github.com/olaboo/mylink/tree/main/MyLink" target="_blank" rel="noopener noreferrer"><span class="icon">↗</span><span class="label"><strong>MyLink 프로젝트</strong><small>이 페이지의 소스 코드 살펴보기</small></span><span>↗</span></a><a class="link" href="https://github.com/olaboo?tab=repositories" target="_blank" rel="noopener noreferrer"><span class="icon">&lt;/&gt;</span><span class="label"><strong>프로젝트 모아보기</strong><small>GitHub 공개 저장소 둘러보기</small></span><span>↗</span></a></nav><button id="share">내 마이링크 주소 복사 ↗</button><p id="status" role="status" aria-live="polite"></p></main><footer>Made by olaboo · MyLink</footer><script>
const theme=document.getElementById('theme');theme.onclick=()=>{const dark=document.body.classList.toggle('dark');theme.textContent=dark?'라이트 모드':'다크 모드'};document.getElementById('share').onclick=async()=>{const status=document.getElementById('status');try{await navigator.clipboard.writeText(location.href);status.textContent='주소를 복사했어요!'}catch{status.textContent='현재 주소: '+location.href}};
</script></body></html>
